const nav=[['home','Dashboard'],['words','Vocab List'],['test','Vocab Test'],['tracking','Tracking']];
function applyTheme(name){document.documentElement.dataset.theme=name;localStorage.setItem('vg-theme',name);let s=document.getElementById('themeSelect');if(s)s.value=name}function setTextColor(color){document.documentElement.style.setProperty('--ink',color);localStorage.setItem('vg-text-color',color);let p=document.getElementById('textColor');if(p)p.value=color}function initTheme(){let t=localStorage.getItem('vg-theme')||'professional';applyTheme(t);let c=localStorage.getItem('vg-text-color');if(c)setTextColor(c);else{let p=document.getElementById('textColor');if(p)p.value='#243238'}}function save(){localStorage.setItem('vg-demo',JSON.stringify(words))}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function normalizeHeader(v){return String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ')}function isKnownHeader(v){const h=normalizeHeader(v);return ['word','words','vocabulary','tu vung','meaning','nghia','ipa','phonetic','phien am','type','word type','loai tu','topic','chu de','cefr','level','priority','status','mastery'].some(x=>h===x||h.includes(x))}function pick(row,names){const entries=Object.entries(row);for(const n of names){const found=entries.find(([k])=>{const h=normalizeHeader(k);return h===n||h.includes(n)});if(found&&String(found[1]??'').trim())return String(found[1]).trim()}return ''}function makeWord(data,idx){const lv=String(data.level||'B1').toUpperCase();const level=(lv.match(/A1|A2|B1|B2|C1|C2/)||['B1'])[0];const pr=String(data.priority||'').toLowerCase();const priority=pr.includes('high')||pr.includes('cao')?'High':pr.includes('low')||pr.includes('thap')?'Low':'Medium';const st=String(data.status||'').toLowerCase();const status=st.includes('master')||st.includes('complete')||st.includes('thuoc')?'Mastered':st.includes('learn')||st.includes('progress')||st.includes('hoc')?'Learning':'New';const m=parseInt(data.mastery,10);return{id:Date.now()+idx,word:String(data.word||'').trim(),ipa:String(data.ipa||'').trim(),type:String(data.type||'').trim(),meaning:String(data.meaning||'').trim()||'Chưa tra cứu',topic:String(data.topic||'').trim()||'General',level,priority,status,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit'}),mastery:Number.isFinite(m)?Math.max(0,Math.min(100,m)):0}}function rowsToWords(rows){let added=[];for(const row of rows){const word=pick(row,['vocabulary','word','words','tu vung','tu']);if(!word)continue;added.push(makeWord({word,ipa:pick(row,['ipa','phonetic','phien am']),type:pick(row,['type','word type','loai tu']),meaning:pick(row,['meaning','nghia','dich','translation']),topic:pick(row,['topic','chu de']),level:pick(row,['cefr','level','cap do','trinh do']),priority:pick(row,['priority','uu tien']),status:pick(row,['status','trang thai']),mastery:pick(row,['mastery','score','progress','diem'])},added.length))}if(!added.length)throw new Error('Không tìm thấy dữ liệu từ vựng.');words=[...added,...words];save();render();alert('Đã nhập '+added.length+' từ. Mỗi từ đã có liên kết tra Google, Cambridge và TFlat.')}function matrixToWords(matrix){const rows=(matrix||[]).filter(r=>Array.isArray(r)&&r.some(x=>String(x??'').trim()));if(!rows.length)throw new Error('File không có dữ liệu.');const hasHeader=rows[0].some(isKnownHeader);if(hasHeader){const headers=rows[0].map(x=>String(x||'').trim());const objs=rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])));return rowsToWords(objs)}let added=[];for(const r of rows){const word=String(r[0]??'').trim();if(!word)continue;const pronunciations=[r[1],r[2]].map(x=>String(x??'').trim()).filter(Boolean);added.push(makeWord({word,ipa:pronunciations.join(' / '),meaning:r[3]??'',type:r[4]??'',topic:r[5]??'',level:r[6]??'B1'},added.length))}if(!added.length)throw new Error('Không tìm thấy từ trong cột A.');words=[...added,...words];save();render();alert('Đã nhập '+added.length+' từ từ file không có tiêu đề. Cột A được hiểu là từ vựng, B/C là phiên âm.')}async function importVocabulary(file){if(!file)return;const ext=(file.name.split('.').pop()||'').toLowerCase();try{if(ext==='csv'){const text=await file.text();const wb=XLSX.read(text,{type:'string'});const matrix=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});matrixToWords(matrix);return}if(ext==='xlsx'||ext==='xls'){const data=await file.arrayBuffer();const wb=XLSX.read(data,{type:'array'});const matrix=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});matrixToWords(matrix);return}if(ext==='docx'){const data=await file.arrayBuffer();const result=await mammoth.convertToHtml({arrayBuffer:data});const box=document.createElement('div');box.innerHTML=result.value;const table=box.querySelector('table');let matrix=[];if(table)matrix=[...table.querySelectorAll('tr')].map(tr=>[...tr.querySelectorAll('th,td')].map(td=>td.textContent.trim()));else{const lines=(box.innerText||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);matrix=lines.map(line=>line.split(/\t|\s{2,}|\|/).map(x=>x.trim()))}matrixToWords(matrix);return}alert('Định dạng chưa hỗ trợ. Dùng CSV, XLS/XLSX hoặc DOCX.')}catch(err){alert('Không thể nhập file: '+(err&&err.message?err.message:err))}}function setTab(t){tab=t;render()}function renderNav(){nav.innerHTML=''}
function chrome(){document.getElementById('nav').innerHTML=nav.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');document.getElementById('mnav').innerHTML=nav.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')"><small>${l}</small></button>`).join('');document.getElementById('title').textContent=tab==='home'?'Study Dashboard':nav.find(x=>x[0]===tab)[1]}
function lookupLinks(word){const q=encodeURIComponent(String(word||'').trim());const slug=encodeURIComponent(String(word||'').trim().toLowerCase()).replace(/%20/g,'-');return `<div class="lookup-links"><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+meaning">Google</a><a target="_blank" rel="noopener" href="https://dictionary.cambridge.org/dictionary/english/${slug}">Cambridge</a><a target="_blank" rel="noopener" href="https://www.google.com/search?q=TFlat+${q}">TFlat</a></div>`}function stats(){return{total:words.length,new:words.filter(w=>w.status==='New').length,learn:words.filter(w=>w.status==='Learning').length,master:words.filter(w=>w.status==='Mastered').length,avg:Math.round(words.reduce((a,w)=>a+w.mastery,0)/words.length)}}
function chartY(v,max){return 125-Math.round((v/Math.max(1,max))*80)}function home(){let s=stats(),mx=Math.max(4,s.master,s.new),ym=chartY(s.master,mx),yn=chartY(s.new,mx);return `<div class="grid"><section class="hero"><div><span class="pill">THIS WEEK</span><h2>You're growing nicely</h2><p>Giữ nhịp học nhẹ nhưng đều. Bạn đang có <b>${s.master}</b> từ đã thuộc.</p><button class="add" onclick="startQuiz()">Start quick test</button></div><div class="goal-circles"><div class="goal-circle" style="--pct:89"><div class="goal-circle-inner"><b>89%</b><span>Tuần</span></div></div><div class="goal-circle month" style="--pct:22"><div class="goal-circle-inner"><b>22%</b><span>Tháng</span></div></div></div></section><div class="stats"><div class="stat"><span>Total vocab</span><b>${s.total}</b></div><div class="stat"><span>Learning</span><b>${s.learn}</b></div><div class="stat"><span>Mastered</span><b>${s.master}</b></div><div class="stat"><span>Avg. mastery</span><b>${s.avg}%</b></div></div><section class="panel"><span class="pill">WEEK-ON-WEEK</span><h3>Vocabulary progress</h3><svg class="chart" viewBox="0 0 360 170"><line x1="20" y1="35" x2="340" y2="35"/><line x1="20" y1="80" x2="340" y2="80"/><line x1="20" y1="125" x2="340" y2="125"/><polyline class="a" points="30,125 180,125 330,${ym}"/><polyline class="b" points="30,125 180,125 330,${yn}"/><circle cx="330" cy="${ym}" r="5" fill="var(--sage)"/><circle cx="330" cy="${yn}" r="4" fill="var(--yellow)"/></svg><div style="font-size:12px;color:var(--muted);line-height:1.55;margin-top:8px"><b style="color:var(--sd)">Xanh:</b> số từ đã hoàn thành · <b style="color:#9a7a25">Vàng:</b> số từ mới thêm.<br>Biểu đồ so sánh 3 mốc: 2 tuần trước → tuần trước → tuần này. Trục dọc là số lượng từ. Hai mốc cũ đang = 0 vì app chưa lưu lịch sử tuần; mốc <b>Tuần này</b> lấy trực tiếp từ dữ liệu hiện tại: <b>${s.master} Mastered</b> và <b>${s.new} New</b>.</div></section><section class="panel"><span class="pill y">TODAY</span><h3>Quick summary</h3><div class="summary"><div><span>Words to review</span><b>0</b></div><div><span>New words today</span><b>0</b></div><div><span>Average study time</span><b>0m</b></div><div><span>Accuracy</span><b>0%</b></div></div></section><section class="panel wide"><span class="pill y">RECENT VOCAB</span><h3>Continue learning</h3>${table(words.slice(0,6))}</section></div>`}
function table(arr){return `<div class="table"><table><thead><tr><th>Audio</th><th>Vocabulary</th><th>Phonetic</th><th>Type</th><th>Meaning</th><th>Topic</th><th>CEFR</th><th>Priority</th><th>Mastery</th><th>Status</th><th>Tra cứu</th></tr></thead><tbody>${arr.map(w=>`<tr><td><button class="spk" onclick="speak('${w.word.replaceAll("'","\\'")}')">Nghe</button></td><td><b>${w.word}</b></td><td>${w.ipa}</td><td>${w.type}</td><td>${w.meaning}</td><td>${w.topic}</td><td><span class="level">${w.level||"B1"}</span></td><td><span class="tag ${w.priority.toLowerCase()}">${w.priority}</span></td><td><b>${w.mastery}%</b></td><td><span class="tag ${w.status}">${w.status}</span></td><td>${lookupLinks(w.word)}</td></tr>`).join('')}</tbody></table></div>`}
function wordView(){let arr=words.filter(w=>(filter==='All'||w.status===filter)&&(`${w.word} ${w.meaning} ${w.topic} ${w.level||''}`.toLowerCase().includes(query.toLowerCase())));return `<section class="panel"><div class="toolbar"><input class="search" placeholder="Search word, meaning or topic..." value="${query}" oninput="query=this.value;render()"><div class="filters">${['All','New','Learning','Mastered'].map(f=>`<button class="${filter===f?'on':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div></div><span class="pill">VOCAB LIST</span><h3>${arr.length} vocabulary items</h3>${table(arr)}</section>`}
function startQuiz(){quiz=[...words].sort(()=>Math.random()-.5).slice(0,Math.min(5,words.length));qi=0;score=0;answered=null;makeOpts();tab='test';render()}function makeOpts(){if(!quiz[qi])return;let c=quiz[qi],ds=words.filter(w=>w.id!==c.id).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.meaning);opts=[...ds,c.meaning].sort(()=>Math.random()-.5)}
function answer(x){if(answered!==null)return;answered=x;let c=quiz[qi];if(x===c.meaning){score++;c.mastery=Math.min(100,c.mastery+8);c.status=c.mastery>=85?'Mastered':'Learning'}else{c.mastery=Math.max(0,c.mastery-5);c.status='Learning'}save();render()}function answerAt(i){answer(opts[i])}function next(){if(qi+1>=quiz.length){quiz=[];render()}else{qi++;answered=null;makeOpts();render()}}
function testView(){if(!quiz.length)return `<section class="panel test"><div><span class="pill y">QUIZ & SUBMIT</span><h2>Random Vocab Test</h2><p>5 từ ngẫu nhiên · kiểm tra nghĩa · cập nhật mastery</p><button class="add" onclick="startQuiz()">Start test</button>${score?`<p><b>Last score: ${score}/5</b></p>`:''}</div></section>`;let c=quiz[qi];return `<section class="panel test"><div style="width:min(780px,100%)"><small>Question ${qi+1}/${quiz.length} · ${score} correct</small><div style="margin-top:40px"><button class="spk" onclick="speak('${c.word}')">Nghe</button><h2>${c.word}</h2><div>${c.ipa}</div><p>Chọn nghĩa đúng:</p></div><div class="choices">${opts.map((o,i)=>`<button ${answered?'disabled':''} class="${answered?(o===c.meaning?'good':o===answered?'bad':''):''}" onclick="answerAt(${i})">${o}</button>`).join('')}</div>${answered?`<p><b>${answered===c.meaning?'Correct':'Not quite'}</b><br>Correct answer: ${c.meaning}</p><button class="add" onclick="next()">${qi+1===quiz.length?'See result':'Next'}</button>`:''}</div></section>`}
function tracking(){return `<section class="panel"><span class="pill">KANBAN TRACKING</span><h3>Learning status</h3><div class="kanban">${['New','Learning','Mastered'].map(st=>`<div class="col"><h4>${st} · ${words.filter(w=>w.status===st).length}</h4>${words.filter(w=>w.status===st).map(w=>`<div class="card"><b>${w.word}</b><button class="spk" style="float:right" onclick="speak('${w.word}')">Nghe</button><p>${w.meaning}</p><small>${w.topic} · ${w.mastery}% mastery</small></div>`).join('')}</div>`).join('')}</div></section>`}
function render(){chrome();document.getElementById('view').innerHTML=tab==='home'?home():tab==='words'?wordView():tab==='test'?testView():tracking()}function openModal(){document.getElementById('modalbg').style.display='grid'}function closeModal(){document.getElementById('modalbg').style.display='none'}document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let d=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit'});words.unshift({id:Date.now(),word:f.get('word'),ipa:f.get('ipa'),type:f.get('type'),meaning:f.get('meaning'),topic:f.get('topic')||'General',level:f.get('level')||'B1',priority:f.get('priority'),status:'New',date:d,mastery:0});save();e.target.reset();closeModal();render()};initTheme();render();
</script></body></html>
