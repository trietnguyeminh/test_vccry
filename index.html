</style><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script></head><body><div class="app"><aside class="side"><div class="brand"><div><b>Vocab Garden</b><small>study softly, grow daily</small></div></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><div><div class="ey">FRIDAY · OCT 03</div><h1 id="title">Study Dashboard</h1></div><div class="top-actions"><div class="theme-tools"><span>Theme</span><select id="themeSelect" onchange="applyTheme(this.value)"><option value="feminine">Nữ tính</option><option value="space">Vũ trụ</option><option value="cartoon">Hoạt hình</option><option value="professional">Chuyên môn</option><option value="github">GitHub</option><option value="starrail">Honkai: Star Rail</option><option value="dragonball">Dragon Ball</option></select><label class="colorpick" title="Tự chọn màu chữ">Aa<input id="textColor" type="color" onchange="setTextColor(this.value)"></label></div><button class="add secondary" onclick="document.getElementById('importFile').click()">Import vocab</button><input id="importFile" type="file" accept=".csv,.xlsx,.xls,.docx" hidden onchange="importVocabulary(this.files[0]);this.value=''"><button class="add" onclick="openModal()">Add word</button></div></header><div id="view"></div></main><nav class="mobile" id="mnav"></nav></div>

{id:6,word:'Break the law',ipa:'/breɪk ðə lɔː/',type:'Verb phrase',meaning:'Phạm luật',topic:'Society',level:'B1',priority:'Medium',status:'New',date:'03/09/26',mastery:10},
{id:7,word:'Conscientious',ipa:'/ˌkɒnʃiˈenʃəs/',type:'Adjective',meaning:'Tận tâm, có lương tâm',topic:'Work',level:'C1',priority:'High',status:'New',date:'04/09/26',mastery:8},
{id:8,word:'Abandon',ipa:'/əˈbændən/',type:'Verb',meaning:'Từ bỏ, bỏ lại',topic:'Society',level:'B2',priority:'Medium',status:'Mastered',date:'04/09/26',mastery:94}
];
const levelMap={'legitimate':'B2','take responsibility':'B1','make progress':'B1','pay attention':'B1','raise awareness':'B2','break the law':'B1','conscientious':'C1','abandon':'B2'};let rawWords=JSON.parse(localStorage.getItem('vg-demo')||'null')||seed;let words=rawWords.map(w=>({...w,level:w.level||levelMap[String(w.word||'').toLowerCase()]||'B1',ipaUK:w.ipaUK||w.ipa||'',ipaUS:w.ipaUS||''})),tab='home',filter='All',levelFilter='All',query='',quiz=[],qi=0,score=0,answered=null,opts=[];

function applyTheme(name){document.documentElement.dataset.theme=name;localStorage.setItem('vg-theme',name);let s=document.getElementById('themeSelect');if(s)s.value=name}function setTextColor(color){document.documentElement.style.setProperty('--ink',color);localStorage.setItem('vg-text-color',color);let p=document.getElementById('textColor');if(p)p.value=color}function initTheme(){let t=localStorage.getItem('vg-theme')||'professional';applyTheme(t);let c=localStorage.getItem('vg-text-color');if(c)setTextColor(c);else{let p=document.getElementById('textColor');if(p)p.value='#243238'}}function save(){localStorage.setItem('vg-demo',JSON.stringify(words))}function speak(t,accent='US'){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=accent==='UK'?'en-GB':'en-US';u.rate=.82;speechSynthesis.speak(u)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function translateVi(text){const q=String(text||'').trim();if(!q)return'';try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair=en|vi');if(!r.ok)return'';const d=await r.json();return String(d?.responseData?.translatedText||'').trim()}catch(e){return''}}
function normalizeHeader(v){return String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ')}function isKnownHeader(v){const h=normalizeHeader(v);return ['word','words','vocabulary','tu vung','meaning','nghia','ipa','phonetic','phien am','type','word type','loai tu','topic','chu de','cefr','level','priority','status','mastery'].some(x=>h===x||h.includes(x))}function pick(row,names){const entries=Object.entries(row);for(const n of names){const found=entries.find(([k])=>{const h=normalizeHeader(k);return h===n||h.includes(n)});if(found&&String(found[1]??'').trim())return String(found[1]).trim()}return ''}function makeWord(data,idx){const lv=String(data.level||'B1').toUpperCase();const level=(lv.match(/A1|A2|B1|B2|C1|C2/)||['B1'])[0];const pr=String(data.priority||'').toLowerCase();const priority=pr.includes('high')||pr.includes('cao')?'High':pr.includes('low')||pr.includes('thap')?'Low':'Medium';const st=String(data.status||'').toLowerCase();const status=st.includes('master')||st.includes('complete')||st.includes('thuoc')?'Mastered':st.includes('learn')||st.includes('progress')||st.includes('hoc')?'Learning':'New';const m=parseInt(data.mastery,10);return{id:Date.now()+idx,word:String(data.word||'').trim(),ipa:String(data.ipa||'').trim(),ipaUK:String(data.ipaUK||data.ipa||'').trim(),ipaUS:String(data.ipaUS||'').trim(),type:String(data.type||'').trim(),meaning:String(data.meaning||'').trim()||'Chưa tra cứu',topic:String(data.topic||'').trim()||'General',level,priority,status,date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit'}),mastery:Number.isFinite(m)?Math.max(0,Math.min(100,m)):0}}function rowsToWords(rows){let added=[];for(const row of rows){const word=pick(row,['vocabulary','word','words','tu vung','tu']);if(!word)continue;added.push(makeWord({word,ipaUK:pick(row,['ipa uk','uk ipa','british ipa','anh anh','phien am anh']),ipaUS:pick(row,['ipa us','us ipa','american ipa','anh my','phien am my']),ipa:pick(row,['ipa','phonetic','phien am']),type:pick(row,['type','word type','loai tu']),meaning:pick(row,['meaning','nghia','dich','translation']),topic:pick(row,['topic','chu de']),level:pick(row,['cefr','level','cap do','trinh do']),priority:pick(row,['priority','uu tien']),status:pick(row,['status','trang thai']),mastery:pick(row,['mastery','score','progress','diem'])},added.length))}if(!added.length)throw new Error('Không tìm thấy dữ liệu từ vựng.');words=[...added,...words];save();render();refillImported(added.map(x=>x.id));alert('Đã nhập '+added.length+' từ. Hệ thống đang tự bổ sung IPA UK/US và loại từ nếu tìm thấy.')}function matrixToWords(matrix){const rows=(matrix||[]).filter(r=>Array.isArray(r)&&r.some(x=>String(x??'').trim()));if(!rows.length)throw new Error('File không có dữ liệu.');const hasHeader=rows[0].some(isKnownHeader);if(hasHeader){const headers=rows[0].map(x=>String(x||'').trim());const objs=rows.slice(1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])));return rowsToWords(objs)}let added=[];for(const r of rows){const word=String(r[0]??'').trim();if(!word)continue;const ipaUK=String(r[1]??'').trim(),ipaUS=String(r[2]??'').trim();added.push(makeWord({word,ipaUK,ipaUS,ipa:ipaUK||ipaUS,meaning:r[3]??'',type:r[4]??'',topic:r[5]??'',level:r[6]??'B1'},added.length))}if(!added.length)throw new Error('Không tìm thấy từ trong cột A.');words=[...added,...words];save();render();refillImported(added.map(x=>x.id));alert('Đã nhập '+added.length+' từ. Cột A = từ vựng, B = IPA UK, C = IPA US. Hệ thống sẽ tự bổ sung phần còn thiếu.')}async function refillWord(w){try{const res=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w.word));if(!res.ok)return false;const data=await res.json();const entry=data&&data[0];if(!entry)return false;const ph=entry.phonetics||[];const findBy=(keys)=>ph.find(p=>keys.some(k=>String(p.audio||'').toLowerCase().includes(k)));const uk=findBy(['-uk.','_uk_','uk.mp3','gb.mp3','-gb.']);const us=findBy(['-us.','_us_','us.mp3']);const general=ph.find(p=>p.text)||{};w.ipaUK=w.ipaUK||(uk&&uk.text)||general.text||'';w.ipaUS=w.ipaUS||(us&&us.text)||general.text||'';w.ipa=w.ipa||w.ipaUK||w.ipaUS||'';if(!w.type&&entry.meanings&&entry.meanings[0])w.type=entry.meanings[0].partOfSpeech||'';w.senses=(entry.meanings||[]).map(m=>({pos:m.partOfSpeech||'',definitions:(m.definitions||[]).slice(0,3).map(d=>({definition:d.definition||'',example:d.example||'',vi:''}))}));if((!w.meaning||w.meaning==='Chưa tra cứu')&&w.word){const vi=await translateVi(w.word);if(vi)w.meaning=vi}return true}catch(e){return false}}async function refillImported(ids){let changed=0;for(const id of ids){const w=words.find(x=>x.id===id);if(w&&(!w.ipaUK||!w.ipaUS||!w.type)){if(await refillWord(w))changed++}}save();render();if(changed)console.info('Refilled '+changed+' imported words')}async function importVocabulary(file){if(!file)return;const ext=(file.name.split('.').pop()||'').toLowerCase();try{if(ext==='csv'){const text=await file.text();const wb=XLSX.read(text,{type:'string'});const matrix=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});matrixToWords(matrix);return}if(ext==='xlsx'||ext==='xls'){const data=await file.arrayBuffer();const wb=XLSX.read(data,{type:'array'});const matrix=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});matrixToWords(matrix);return}if(ext==='docx'){const data=await file.arrayBuffer();const result=await mammoth.convertToHtml({arrayBuffer:data});const box=document.createElement('div');box.innerHTML=result.value;const table=box.querySelector('table');let matrix=[];if(table)matrix=[...table.querySelectorAll('tr')].map(tr=>[...tr.querySelectorAll('th,td')].map(td=>td.textContent.trim()));else{const lines=(box.innerText||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);matrix=lines.map(line=>line.split(/\t|\s{2,}|\|/).map(x=>x.trim()))}matrixToWords(matrix);return}alert('Định dạng chưa hỗ trợ. Dùng CSV, XLS/XLSX hoặc DOCX.')}catch(err){alert('Không thể nhập file: '+(err&&err.message?err.message:err))}}async function translateSenseDetails(w){if(!w||!Array.isArray(w.senses))return;let changed=false;for(const sense of w.senses){for(const d of (sense.definitions||[]).slice(0,2)){if(!d.vi&&d.definition){const vi=await translateVi(d.definition);if(vi){d.vi=vi;changed=true}}}}if(changed)save()}
let previewWordId=null;
function positionPreview(e){const p=document.getElementById('wordPreview');if(!p)return;const pad=14,w=430,h=Math.min(560,p.scrollHeight||420);let x=e.clientX+16,y=e.clientY+16;if(x+w>window.innerWidth-pad)x=e.clientX-w-16;if(y+h>window.innerHeight-pad)y=Math.max(pad,window.innerHeight-h-pad);p.style.left=Math.max(pad,x)+'px';p.style.top=Math.max(pad,y)+'px'}
function previewHtml(w,loading=false){const q=encodeURIComponent(w.word);const slug=encodeURIComponent(w.word.toLowerCase()).replace(/%20/g,'-');const senses=(w.senses||[]);return '<h3>'+esc(w.word)+'</h3><div class="preview-ipa">UK: '+esc(w.ipaUK||w.ipa||'—')+' &nbsp;·&nbsp; US: '+esc(w.ipaUS||'—')+'</div><div class="preview-meaning"><b>Nghĩa nhanh:</b> '+esc(w.meaning||'Đang tra...')+'</div>'+(loading?'<div class="preview-loading">Đang tải đầy đủ nghĩa theo loại từ...</div>':'')+senses.map(s=>'<div class="preview-pos"><strong>'+esc(s.pos||'Khác')+'</strong>'+((s.definitions||[]).slice(0,3).map(d=>'<div class="preview-def">'+esc(d.vi||d.definition)+(d.vi&&d.definition?'<em>'+esc(d.definition)+'</em>':'')+(d.example?'<em>Ví dụ: '+esc(d.example)+'</em>':'')+'</div>').join(''))+'</div>').join('')+'<div class="preview-links"><a target="_blank" rel="noopener" href="https://www.google.com/search?q='+q+'+example+sentence">Ví dụ trên Google</a><a target="_blank" rel="noopener" href="https://dictionary.cambridge.org/dictionary/english/'+slug+'">Cambridge</a></div>'}
async function showWordPreview(e,id){previewWordId=id;const p=document.getElementById('wordPreview'),w=words.find(x=>x.id===id);if(!p||!w)return;p.innerHTML=previewHtml(w,!w.senses);p.classList.add('show');positionPreview(e);if(!w.senses){await refillWord(w);save()}await translateSenseDetails(w);if(previewWordId===id){p.innerHTML=previewHtml(w,false);positionPreview(e)}}
function moveWordPreview(e){if(previewWordId!==null)positionPreview(e)}
function hideWordPreview(){previewWordId=null;const p=document.getElementById('wordPreview');if(p)p.classList.remove('show')}
function setTab(t){tab=t;hideWordPreview();render()}function renderNav(){nav.innerHTML=''}
function chrome(){document.getElementById('nav').innerHTML=nav.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');document.getElementById('mnav').innerHTML=nav.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')"><small>${l}</small></button>`).join('');document.getElementById('title').textContent=tab==='home'?'Study Dashboard':nav.find(x=>x[0]===tab)[1]}
function lookupLinks(word){const q=encodeURIComponent(String(word||'').trim());const slug=encodeURIComponent(String(word||'').trim().toLowerCase()).replace(/%20/g,'-');return `<div class="lookup-links"><a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+meaning">Google</a><a target="_blank" rel="noopener" href="https://dictionary.cambridge.org/dictionary/english/${slug}">Cambridge</a><a target="_blank" rel="noopener" href="https://www.google.com/search?q=TFlat+${q}">TFlat</a></div>`}function stats(){return{total:words.length,new:words.filter(w=>w.status==='New').length,learn:words.filter(w=>w.status==='Learning').length,master:words.filter(w=>w.status==='Mastered').length,avg:Math.round(words.reduce((a,w)=>a+w.mastery,0)/words.length)}}
function chartY(v,max){return 125-Math.round((v/Math.max(1,max))*80)}function home(){let s=stats(),mx=Math.max(4,s.master,s.new),ym=chartY(s.master,mx),yn=chartY(s.new,mx);return `<div class="grid"><section class="hero"><div><span class="pill">THIS WEEK</span><h2>You're growing nicely</h2><p>Giữ nhịp học nhẹ nhưng đều. Bạn đang có <b>${s.master}</b> từ đã thuộc.</p><button class="add" onclick="startQuiz()">Start quick test</button></div><div class="goal-circles"><div class="goal-circle" style="--pct:89"><div class="goal-circle-inner"><b>89%</b><span>Tuần</span></div></div><div class="goal-circle month" style="--pct:22"><div class="goal-circle-inner"><b>22%</b><span>Tháng</span></div></div></div></section><div class="stats"><div class="stat"><span>Total vocab</span><b>${s.total}</b></div><div class="stat"><span>Learning</span><b>${s.learn}</b></div><div class="stat"><span>Mastered</span><b>${s.master}</b></div><div class="stat"><span>Avg. mastery</span><b>${s.avg}%</b></div></div><section class="panel"><span class="pill">WEEK-ON-WEEK</span><h3>Vocabulary progress</h3><svg class="chart" viewBox="0 0 390 195"><line x1="42" y1="30" x2="360" y2="30"/><line x1="42" y1="75" x2="360" y2="75"/><line x1="42" y1="120" x2="360" y2="120"/><line x1="42" y1="155" x2="360" y2="155"/><text x="8" y="159">0 từ</text><text x="2" y="124">${Math.ceil(mx/3)} từ</text><text x="2" y="79">${Math.ceil(mx*2/3)} từ</text><text x="2" y="34">${mx} từ</text><polyline class="a" points="65,155 200,155 335,${ym}"/><polyline class="b" points="65,155 200,155 335,${yn}"/><circle cx="335" cy="${ym}" r="5" fill="#2f81f7"/><circle cx="335" cy="${yn}" r="5" fill="#d62828"/><text class="value-blue" x="345" y="${Math.max(14,ym-8)}">${s.master} từ</text><text class="value-red" x="345" y="${Math.min(183,yn+16)}">${s.new} từ</text><text x="45" y="184">2 tuần trước</text><text x="174" y="184">Tuần trước</text><text x="313" y="184">Tuần này</text></svg><div class="chart-legend"><span><i class="legend-line blue"></i><b>Xanh GitHub:</b> số từ đã Mastered</span><span><i class="legend-line red"></i><b>Đỏ:</b> số từ mới</span></div><div class="chart-data"><div><b>2 tuần trước</b><small>Mastered: 0 từ<br>New: 0 từ</small></div><div><b>Tuần trước</b><small>Mastered: 0<br>New: 0</small></div><div><b>Tuần này</b><small>Mastered: ${s.master} từ<br>New: ${s.new} từ<br>Learning: ${s.learn} từ<br>Tổng: ${s.total} từ<br>Mastery TB: ${s.avg}%</small></div></div><div style="font-size:11px;color:var(--muted);line-height:1.5;margin-top:9px">Hai tuần trước hiện là 0 vì V1 chưa lưu lịch sử theo tuần. Từ tuần này trở đi, số hiện tại lấy trực tiếp từ dữ liệu học của bạn.</div></section><section class="panel"><span class="pill y">TODAY</span><h3>Quick summary</h3><div class="summary"><div><span>Words to review</span><b>0</b></div><div><span>New words today</span><b>0</b></div><div><span>Average study time</span><b>0m</b></div><div><span>Accuracy</span><b>0%</b></div></div></section><section class="panel wide"><span class="pill y">RECENT VOCAB</span><h3>Continue learning</h3>${table(words.slice(0,6))}</section></div>`}
function table(arr){return `<div class="table"><table><thead><tr><th>Audio</th><th>Vocabulary</th><th>IPA UK</th><th>IPA US</th><th>Type</th><th>Meaning</th><th>Topic</th><th>CEFR</th><th>Priority</th><th>Mastery</th><th>Status</th><th>Tra cứu</th></tr></thead><tbody>${arr.map(w=>`<tr><td><div class="lookup-links"><button class="spk text-spk" onclick="speak('${w.word.replaceAll("'","\\'")}','UK')">UK</button><button class="spk text-spk" onclick="speak('${w.word.replaceAll("'","\\'")}','US')">US</button></div></td><td><b class="word-cell" onmouseenter="showWordPreview(event,${w.id})" onmousemove="moveWordPreview(event)" onmouseleave="hideWordPreview()">${w.word}</b></td><td>${w.ipaUK||w.ipa||'—'}</td><td>${w.ipaUS||'—'}</td><td>${w.type||'—'}</td><td>${w.meaning}</td><td>${w.topic}</td><td><span class="level">${w.level||"B1"}</span></td><td><span class="tag ${w.priority.toLowerCase()}">${w.priority}</span></td><td><b>${w.mastery}%</b></td><td><span class="tag ${w.status}">${w.status}</span></td><td>${lookupLinks(w.word)}</td></tr>`).join('')}</tbody></table></div>`}
function wordView(){let arr=words.filter(w=>(filter==='All'||w.status===filter)&&(levelFilter==='All'||w.level===levelFilter)&&(`${w.word} ${w.meaning} ${w.topic} ${w.level||''}`.toLowerCase().includes(query.toLowerCase())));return `<section class="panel"><div class="toolbar"><input class="search" placeholder="Search word, meaning, topic or CEFR..." value="${query}" oninput="query=this.value;render()"><div class="filters">${['All','New','Learning','Mastered'].map(f=>`<button class="${filter===f?'on':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div><div class="cefr-filter">${['All','A1','A2','B1','B2','C1','C2'].map(l=>`<button class="${levelFilter===l?'on':''}" onclick="levelFilter='${l}';render()">${l}</button>`).join('')}</div></div><span class="pill">VOCAB LIST</span><h3>${arr.length} vocabulary items</h3>${table(arr)}</section>`}
function startQuiz(){quiz=[...words].sort(()=>Math.random()-.5).slice(0,Math.min(5,words.length));qi=0;score=0;answered=null;makeOpts();tab='test';render()}function makeOpts(){if(!quiz[qi])return;let c=quiz[qi],ds=words.filter(w=>w.id!==c.id).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.meaning);opts=[...ds,c.meaning].sort(()=>Math.random()-.5)}
function answer(x){if(answered!==null)return;answered=x;let c=quiz[qi];if(x===c.meaning){score++;c.mastery=Math.min(100,c.mastery+8);c.status=c.mastery>=85?'Mastered':'Learning'}else{c.mastery=Math.max(0,c.mastery-5);c.status='Learning'}save();render()}function answerAt(i){answer(opts[i])}function next(){if(qi+1>=quiz.length){quiz=[];render()}else{qi++;answered=null;makeOpts();render()}}
function testView(){if(!quiz.length)return `<section class="panel test"><div><span class="pill y">QUIZ & SUBMIT</span><h2>Random Vocab Test</h2><p>5 từ ngẫu nhiên · kiểm tra nghĩa · cập nhật mastery</p><button class="add" onclick="startQuiz()">Start test</button>${score?`<p><b>Last score: ${score}/5</b></p>`:''}</div></section>`;let c=quiz[qi];return `<section class="panel test"><div style="width:min(780px,100%)"><small>Question ${qi+1}/${quiz.length} · ${score} correct</small><div style="margin-top:40px"><button class="spk" onclick="speak('${c.word}')">Nghe</button><h2>${c.word}</h2><div>${c.ipa}</div><p>Chọn nghĩa đúng:</p></div><div class="choices">${opts.map((o,i)=>`<button ${answered?'disabled':''} class="${answered?(o===c.meaning?'good':o===answered?'bad':''):''}" onclick="answerAt(${i})">${o}</button>`).join('')}</div>${answered?`<p><b>${answered===c.meaning?'Correct':'Not quite'}</b><br>Correct answer: ${c.meaning}</p><button class="add" onclick="next()">${qi+1===quiz.length?'See result':'Next'}</button>`:''}</div></section>`}
function changeStatus(id,status){words=words.map(w=>w.id===id?{...w,status}:w);save();render()}function tracking(){return `<section class="panel"><span class="pill">TRACKING</span><h3>Learning status</h3><p style="color:var(--muted);font-size:12px;margin-top:-5px">Theo dõi trạng thái, CEFR và mức độ ghi nhớ của từng từ.</p><div class="kanban">${['New','Learning','Mastered'].map(st=>`<div class="col"><h4>${st} · ${words.filter(w=>w.status===st).length}</h4>${words.filter(w=>w.status===st).map(w=>`<div class="card"><div class="track-top"><div><b class="word-cell" onmouseenter="showWordPreview(event,${w.id})" onmousemove="moveWordPreview(event)" onmouseleave="hideWordPreview()">${w.word}</b><div class="phonetics">UK: ${w.ipaUK||w.ipa||'—'}<br>US: ${w.ipaUS||'—'}</div></div><div class="lookup-links"><button class="spk text-spk" onclick="speak('${w.word.replaceAll("'","\\'")}','UK')">UK</button><button class="spk text-spk" onclick="speak('${w.word.replaceAll("'","\\'")}','US')">US</button></div></div><p>${w.meaning}</p><div class="track-meta"><span class="level">${w.level||'B1'}</span><span class="tag ${w.priority.toLowerCase()}">${w.priority}</span></div><div class="track-bar"><i style="width:${w.mastery}%"></i></div><small>${w.mastery}% mastery · ${w.topic}</small><div class="track-actions"><span style="font-size:11px;color:var(--muted)">Trạng thái</span><select onchange="changeStatus(${w.id},this.value)"><option ${w.status==='New'?'selected':''}>New</option><option ${w.status==='Learning'?'selected':''}>Learning</option><option ${w.status==='Mastered'?'selected':''}>Mastered</option></select></div></div>`).join('')}</div>`).join('')}</div></section>`}function autoRefillMissing(){const ids=words.filter(w=>!w.meaning||w.meaning==='Chưa tra cứu'||!w.senses).slice(0,12).map(w=>w.id);if(ids.length)setTimeout(()=>refillImported(ids),500)}function render(){chrome();document.getElementById('view').innerHTML=tab==='home'?home():tab==='words'?wordView():tab==='test'?testView():tracking()}function openModal(){document.getElementById('modalbg').style.display='grid'}function closeModal(){document.getElementById('modalbg').style.display='none'}document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let d=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit'});words.unshift({id:Date.now(),word:f.get('word'),ipa:f.get('ipa'),ipaUK:f.get('ipa'),ipaUS:'',type:f.get('type'),meaning:f.get('meaning'),topic:f.get('topic')||'General',level:f.get('level')||'B1',priority:f.get('priority'),status:'New',date:d,mastery:0});save();e.target.reset();closeModal();render()};initTheme();render();autoRefillMissing();
</script></body></html>
