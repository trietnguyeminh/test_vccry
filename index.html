<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocab Garden Demo</title><style>
:root{--cream:#f7f2e7;--paper:#fffdf7;--sage:#7f9368;--sd:#566747;--ss:#dce7d2;--yellow:#d9b864;--ys:#f5e8bd;--pink:#d99b9c;--ps:#f4d9d8;--ink:#38382f;--muted:#777568;--line:#ddd7c8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{padding:24px 16px;border-right:1px solid var(--line);background:#fffdf7ee;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;margin-bottom:28px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--sage);color:#fff;font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;color:#666056}.nav button.on{background:var(--ss);color:var(--sd);font-weight:800}.main{padding:28px 30px 80px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:3px 0;font-size:28px}.ey{font-size:11px;letter-spacing:1.4px;color:#948f83}.add{border:0;background:var(--sage);color:#fff;padding:11px 15px;border-radius:12px;font-weight:800}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.hero,.panel,.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px #433b2410}.hero{grid-column:1/-1;padding:24px;background:linear-gradient(135deg,#eee8c9,#dbe8d1);display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h2{font-size:30px;margin:7px 0}.hero p{color:#686456}.rings{display:flex;gap:18px}.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--sage) 319deg,#fff 0);padding:11px}.ring.m{background:conic-gradient(var(--yellow) 79deg,#fff 0)}.ri{width:100%;height:100%;border-radius:50%;background:var(--paper);display:grid;place-items:center;align-content:center}.ri b{font-size:22px}.ri small{color:var(--muted)}.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:29px;margin-top:6px}.panel{padding:18px}.wide{grid-column:1/-1}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--ss);color:var(--sd);font-size:10px;font-weight:900;letter-spacing:1px}.pill.y{background:var(--ys);color:#7f6b2d}.panel h3{margin:7px 0 14px}.summary div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13px}.chart{width:100%;height:190px}.chart line{stroke:#ded8ca}.chart .a{fill:none;stroke:var(--sage);stroke-width:4}.chart .b{fill:none;stroke:var(--yellow);stroke-width:4}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:14px}.search{flex:1;border:1px solid var(--line);background:#fbf7ee;border-radius:11px;padding:10px 12px}.filters{display:flex;gap:6px}.filters button{border:1px solid var(--line);background:#fffaf0;border-radius:9px;padding:8px 10px}.filters button.on{background:var(--ss);font-weight:800;color:var(--sd)}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:850px;font-size:12px}.table th{background:#f4efdf;text-align:left;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:11px 10px;border-bottom:1px solid #eee8d9}.tag{padding:4px 7px;border-radius:7px;font-size:10px;font-weight:800}.high{background:#f2d0cc;color:#95524e}.medium{background:#f4e5ba;color:#846a26}.low{background:#dce8d6;color:#587050}.New{background:#f4e0c7;color:#906d39}.Learning{background:#efd8d8;color:#91575d}.Mastered{background:#dce9d6;color:#587050}.spk{border:1px solid var(--line);background:#fffaf0;border-radius:50%;width:30px;height:30px}.test{min-height:560px;display:grid;place-items:center;text-align:center;background:linear-gradient(180deg,#f4eed1,#fffdf7 45%)}.test h2{font-size:40px;margin:12px 0;color:var(--sd)}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:650px;margin:20px auto}.choices button{padding:14px;border-radius:12px;border:1px solid var(--line);background:#fff}.choices button.good{background:#dcebd5;border-color:#8fa67d}.choices button.bad{background:#f3d8d6;border-color:#c48782}.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.col{background:#f6f1e6;border:1px solid var(--line);border-radius:14px;padding:10px}.col h4{margin:0 0 10px;padding:9px;border-radius:9px;background:#eee4c8}.card{background:#fff;border:1px solid #e8e0d2;border-radius:12px;padding:12px;margin:9px 0;text-align:left}.card p{font-size:12px;color:var(--muted)}.mobile{display:none}.modalbg{position:fixed;inset:0;background:#2227;display:none;place-items:center;padding:20px}.modal{background:var(--paper);padding:22px;border-radius:18px;width:min(620px,100%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;font-weight:700}.form input,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:5px;background:#fbf8ef}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.actions button{padding:10px 14px;border-radius:10px;border:1px solid var(--line)}.actions .save{background:var(--sage);color:#fff;border:0}@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:16px 12px 84px}.grid{grid-template-columns:1fr}.hero{display:block}.rings{margin-top:18px}.ring{width:100px;height:100px}.stats{grid-template-columns:1fr 1fr}.kanban{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;height:68px;grid-template-columns:repeat(4,1fr);background:#fffdf7f5;border-top:1px solid var(--line)}.mobile button{border:0;background:transparent}.mobile button.on{color:var(--sd);font-weight:900}.form{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">VG</div><div><b>Vocab Garden</b><small>study softly, grow daily</small></div></div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><div><div class="ey">FRIDAY · OCT 03</div><h1 id="title">Study Dashboard</h1></div><button class="add" onclick="openModal()">＋ Add word</button></header><div id="view"></div></main><nav class="mobile" id="mnav"></nav></div>
<div class="modalbg" id="modalbg" onclick="if(event.target===this) closeModal()"><form class="modal" id="form"><h2>Add a new word</h2><div class="form"><label>Vocabulary<input name="word" required placeholder="abandon"></label><label>IPA<input name="ipa" placeholder="/əˈbændən/"></label><label>Word type<input name="type" placeholder="Verb"></label><label>Meaning<input name="meaning" required placeholder="Từ bỏ"></label><label>Topic<input name="topic" placeholder="Society"></label><label>Priority<select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label></div><div class="actions"><button type="button" onclick="closeModal()">Cancel</button><button class="save">Save vocabulary</button></div></form></div>
<script>
const seed=[
{id:1,word:'Legitimate',ipa:'/lɪˈdʒɪtɪmət/',type:'Adjective',meaning:'Hợp pháp, chính đáng',topic:'Society',priority:'Medium',status:'Mastered',date:'17/08/26',mastery:100},
{id:2,word:'Take responsibility',ipa:'/teɪk rɪˌspɒnsəˈbɪləti/',type:'Verb phrase',meaning:'Chịu trách nhiệm',topic:'Work',priority:'High',status:'Mastered',date:'17/08/26',mastery:100},
{id:3,word:'Make progress',ipa:'/meɪk ˈprəʊɡres/',type:'Verb phrase',meaning:'Tiến bộ',topic:'Education',priority:'Medium',status:'Learning',date:'01/09/26',mastery:68},
{id:4,word:'Pay attention',ipa:'/peɪ əˈtenʃn/',type:'Verb phrase',meaning:'Chú ý',topic:'Education',priority:'High',status:'Learning',date:'01/09/26',mastery:54},
{id:5,word:'Raise awareness',ipa:'/reɪz əˈweənəs/',type:'Verb phrase',meaning:'Nâng cao nhận thức',topic:'Society',priority:'High',status:'Learning',date:'02/09/26',mastery:47},
{id:6,word:'Break the law',ipa:'/breɪk ðə lɔː/',type:'Verb phrase',meaning:'Phạm luật',topic:'Society',priority:'Medium',status:'New',date:'03/09/26',mastery:10},
{id:7,word:'Conscientious',ipa:'/ˌkɒnʃiˈenʃəs/',type:'Adjective',meaning:'Tận tâm, có lương tâm',topic:'Work',priority:'High',status:'New',date:'04/09/26',mastery:8},
{id:8,word:'Abandon',ipa:'/əˈbændən/',type:'Verb',meaning:'Từ bỏ, bỏ lại',topic:'Society',priority:'Medium',status:'Mastered',date:'04/09/26',mastery:94}
];
let words=JSON.parse(localStorage.getItem('vg-demo')||'null')||seed,tab='home',filter='All',query='',quiz=[],qi=0,score=0,answered=null,opts=[];
const nav=[['home','⌂ Dashboard'],['words','▤ Vocab List'],['test','✎ Vocab Test'],['tracking','◫ Tracking']];
function save(){localStorage.setItem('vg-demo',JSON.stringify(words))}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function setTab(t){tab=t;render()}function renderNav(){nav.innerHTML=''}
function chrome(){document.getElementById('nav').innerHTML=nav.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');document.getElementById('mnav').innerHTML=nav.map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="setTab('${k}')">${l.split(' ')[0]}<br><small>${l.substring(2)}</small></button>`).join('');document.getElementById('title').textContent=tab==='home'?'Study Dashboard':nav.find(x=>x[0]===tab)[1].substring(2)}
function stats(){return{total:words.length,new:words.filter(w=>w.status==='New').length,learn:words.filter(w=>w.status==='Learning').length,master:words.filter(w=>w.status==='Mastered').length,avg:Math.round(words.reduce((a,w)=>a+w.mastery,0)/words.length)}}
function home(){let s=stats();return `<div class="grid"><section class="hero"><div><span class="pill">THIS WEEK</span><h2>You're growing nicely 🌿</h2><p>Giữ nhịp học nhẹ nhưng đều. Bạn đang có <b>${s.master}</b> từ đã thuộc.</p><button class="add" onclick="startQuiz()">Start quick test →</button></div><div class="rings"><div class="ring"><div class="ri"><b>31/35</b><small>89%</small></div></div><div class="ring m"><div class="ri"><b>44/200</b><small>22%</small></div></div></div></section><div class="stats"><div class="stat"><span>Total vocab</span><b>${s.total}</b></div><div class="stat"><span>Learning</span><b>${s.learn}</b></div><div class="stat"><span>Mastered</span><b>${s.master}</b></div><div class="stat"><span>Avg. mastery</span><b>${s.avg}%</b></div></div><section class="panel"><span class="pill">WEEK-ON-WEEK</span><h3>Vocabulary progress</h3><svg class="chart" viewBox="0 0 360 170"><line x1="20" y1="35" x2="340" y2="35"/><line x1="20" y1="80" x2="340" y2="80"/><line x1="20" y1="125" x2="340" y2="125"/><polyline class="a" points="30,125 180,90 330,50"/><polyline class="b" points="30,50 180,68 330,100"/></svg></section><section class="panel"><span class="pill y">TODAY</span><h3>Quick summary</h3><div class="summary"><div><span>Words to review</span><b>16</b></div><div><span>New words</span><b>${s.new}</b></div><div><span>Average study time</span><b>6m 24s</b></div><div><span>Accuracy</span><b>89%</b></div></div></section><section class="panel wide"><span class="pill y">RECENT VOCAB</span><h3>Continue learning</h3>${table(words.slice(0,6))}</section></div>`}
function table(arr){return `<div class="table"><table><thead><tr><th>🔊</th><th>Vocabulary</th><th>Phonetic</th><th>Type</th><th>Meaning</th><th>Topic</th><th>Priority</th><th>Mastery</th><th>Status</th></tr></thead><tbody>${arr.map(w=>`<tr><td><button class="spk" onclick="speak('${w.word.replaceAll("'","\\'")}')">▶</button></td><td><b>${w.word}</b></td><td>${w.ipa}</td><td>${w.type}</td><td>${w.meaning}</td><td>${w.topic}</td><td><span class="tag ${w.priority.toLowerCase()}">${w.priority}</span></td><td><b>${w.mastery}%</b></td><td><span class="tag ${w.status}">${w.status}</span></td></tr>`).join('')}</tbody></table></div>`}
function wordView(){let arr=words.filter(w=>(filter==='All'||w.status===filter)&&(`${w.word} ${w.meaning} ${w.topic}`.toLowerCase().includes(query.toLowerCase())));return `<section class="panel"><div class="toolbar"><input class="search" placeholder="Search word, meaning or topic..." value="${query}" oninput="query=this.value;render()"><div class="filters">${['All','New','Learning','Mastered'].map(f=>`<button class="${filter===f?'on':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}</div></div><span class="pill">VOCAB LIST</span><h3>${arr.length} vocabulary items</h3>${table(arr)}</section>`}
function startQuiz(){quiz=[...words].sort(()=>Math.random()-.5).slice(0,Math.min(5,words.length));qi=0;score=0;answered=null;makeOpts();tab='test';render()}function makeOpts(){if(!quiz[qi])return;let c=quiz[qi],ds=words.filter(w=>w.id!==c.id).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.meaning);opts=[...ds,c.meaning].sort(()=>Math.random()-.5)}
function answer(x){if(answered!==null)return;answered=x;let c=quiz[qi];if(x===c.meaning){score++;c.mastery=Math.min(100,c.mastery+8);c.status=c.mastery>=85?'Mastered':'Learning'}else{c.mastery=Math.max(0,c.mastery-5);c.status='Learning'}save();render()}function next(){if(qi+1>=quiz.length){quiz=[];render()}else{qi++;answered=null;makeOpts();render()}}
function testView(){if(!quiz.length)return `<section class="panel test"><div><span class="pill y">QUIZ & SUBMIT</span><h2>Random Vocab Test</h2><p>5 từ ngẫu nhiên · kiểm tra nghĩa · cập nhật mastery</p><button class="add" onclick="startQuiz()">Start test</button>${score?`<p><b>Last score: ${score}/5</b></p>`:''}</div></section>`;let c=quiz[qi];return `<section class="panel test"><div style="width:min(780px,100%)"><small>Question ${qi+1}/${quiz.length} · ${score} correct</small><div style="margin-top:40px"><button class="spk" onclick="speak('${c.word}')">▶</button><h2>${c.word}</h2><div>${c.ipa}</div><p>Chọn nghĩa đúng:</p></div><div class="choices">${opts.map(o=>`<button ${answered?'disabled':''} class="${answered?(o===c.meaning?'good':o===answered?'bad':''):''}" onclick="answer(${JSON.stringify(o)})">${o}</button>`).join('')}</div>${answered?`<p><b>${answered===c.meaning?'✓ Correct':'✕ Not quite'}</b><br>Correct answer: ${c.meaning}</p><button class="add" onclick="next()">${qi+1===quiz.length?'See result':'Next →'}</button>`:''}</div></section>`}
function tracking(){return `<section class="panel"><span class="pill">KANBAN TRACKING</span><h3>Learning status</h3><div class="kanban">${['New','Learning','Mastered'].map(st=>`<div class="col"><h4>${st} · ${words.filter(w=>w.status===st).length}</h4>${words.filter(w=>w.status===st).map(w=>`<div class="card"><b>${w.word}</b><button class="spk" style="float:right" onclick="speak('${w.word}')">▶</button><p>${w.meaning}</p><small>${w.topic} · ${w.mastery}% mastery</small></div>`).join('')}</div>`).join('')}</div></section>`}
function render(){chrome();document.getElementById('view').innerHTML=tab==='home'?home():tab==='words'?wordView():tab==='test'?testView():tracking()}function openModal(){document.getElementById('modalbg').style.display='grid'}function closeModal(){document.getElementById('modalbg').style.display='none'}document.getElementById('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let d=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit'});words.unshift({id:Date.now(),word:f.get('word'),ipa:f.get('ipa'),type:f.get('type'),meaning:f.get('meaning'),topic:f.get('topic')||'General',priority:f.get('priority'),status:'New',date:d,mastery:0});save();e.target.reset();closeModal();render()};render();
</script></body></html>
